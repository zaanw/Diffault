name: Desktop
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and build the native engine
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 test --locked --manifest-path engine/Cargo.toml
          cargo +1.100.0 build --release --locked --manifest-path engine/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Verify comparison, exports and SQLite
        shell: pwsh
        run: |
          dotnet restore checks/ErrorHunt.Checks.csproj --locked-mode
          dotnet run --no-restore --project checks/ErrorHunt.Checks.csproj -- engine/target/x86_64-pc-windows-msvc/release/errorhunt-engine.exe
      - name: Create the self-contained Windows x64 build
        shell: pwsh
        run: |
          $engine = (Resolve-Path engine/target/x86_64-pc-windows-msvc/release/errorhunt-engine.exe).Path
          dotnet publish desktop/ErrorHunt.Desktop.csproj -c Release -r win-x64 --self-contained -p:RestoreLockedMode=true "-p:EngineExecutable=$engine" -o artifacts/win-x64
          if (!(Test-Path artifacts/win-x64/ErrorHunt.Desktop.exe) -or !(Test-Path artifacts/win-x64/errorhunt-engine.exe)) {
            throw "Missing executable in the Windows build."
          }
          dotnet run --no-build --no-restore --project checks/ErrorHunt.Checks.csproj -- artifacts/win-x64/errorhunt-engine.exe
      - name: Smoke test the packaged WPF application
        shell: pwsh
        run: |
          $before = Join-Path $env:RUNNER_TEMP 'errorhunt-before.log'
          $after = Join-Path $env:RUNNER_TEMP 'errorhunt-after.log'
          @('Main.cs(1,2): error CS0103: missing', 'old.go:2: undefined: old') | Set-Content -Encoding utf8 $before
          @('Main.cs(7,5): error CS0103: missing', 'new.go:2: undefined: new') | Set-Content -Encoding utf8 $after
          $stderr = Join-Path $env:RUNNER_TEMP 'errorhunt-wpf-stderr.log'
          $process = Start-Process artifacts/win-x64/ErrorHunt.Desktop.exe -ArgumentList @('--smoke-test', ('"' + $before + '"'), ('"' + $after + '"')) -PassThru
          if (!$process.WaitForExit(30000)) {
            $process.Kill()
            throw "The WPF smoke test timed out."
          }
          if ($process.ExitCode -ne 0) {
            Get-Content $stderr
            throw "The WPF smoke test failed with exit code $($process.ExitCode)."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ErrorHunt-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Test the batch command against the engine
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 build --locked --manifest-path engine/Cargo.toml
          export ERRORHUNT_TEST_ENGINE="$PWD/engine/target/debug/errorhunt-engine"
          cd batch
          go test -v ./...
      - name: Test the report viewer
        working-directory: viewer
        run: |
          npm ci
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: ErrorHunt-report-viewer
          path: viewer/dist/index.html
          if-no-files-found: error

  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install optional interpreters
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli lua5.4 lua-cjson
      - name: Verify optional adapters with the engine
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 build --locked --manifest-path engine/Cargo.toml
          swift --version
          for adapter in java php lua swift; do
            python3 adapters/check.py engine/target/debug/errorhunt-engine "$adapter"
          done
