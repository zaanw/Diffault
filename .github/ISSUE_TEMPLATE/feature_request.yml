name: Feature request
description: Suggest an improvement to Diffault
title: "[Feature] "
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: Describe what you are trying to accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what should happen and where in Diffault it should appear.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Optionally include a synthetic example or a screenshot with sensitive information removed.
